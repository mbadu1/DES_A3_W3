name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install packages
        run: make install
      - name: lint
        run: make lint
      - name: Run tests
        run: make test
      - name: format
        run: make format
      - name: deploy
        run: make deploy
